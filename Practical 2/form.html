<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Practical 2: Modern Entry Form</title>
	<link rel="stylesheet" href="style.css" />
</head>
<body>
	<main class="page-shell">
		<section class="hero-panel">
			<h1>Student / Faculty Entry Form</h1>
			<p class="hero-copy">A cleaner, modern form layout with a more polished look and a few updated questions.</p>
		</section>

		<section class="form-card" aria-labelledby="form-title">
			<div class="card-header">
				<h2 id="form-title">Registration Details</h2>
				<p>Fill in the information below to complete your entry.</p>
			</div>

			<form class="entry-form">
				<div class="form-grid">
					<div class="field full-width">
						<label for="fullName">Full Name</label>
						<input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required />
					</div>

					<div class="field">
						<label for="email">Email Address</label>
						<input type="email" id="email" name="email" placeholder="name@example.com" required />
					</div>

					<div class="field">
						<label for="phone">Phone Number</label>
						<input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" />
					</div>

					<div class="field">
						<label for="role">Role</label>
						<select id="role" name="role">
							<option value="student">Student</option>
							<option value="faculty">Faculty</option>
							<option value="guest">Guest</option>
						</select>
					</div>

					<div class="field">
						<label for="department">Department / Subject</label>
						<select id="department" name="department">
							<option value="cse">Computer Science</option>
							<option value="ece">Electronics</option>
							<option value="me">Mechanical</option>
							<option value="business">Business Studies</option>
						</select>
					</div>

					<div class="field">
						<label for="experience">Experience Level</label>
						<select id="experience" name="experience">
							<option value="beginner">Beginner</option>
							<option value="intermediate">Intermediate</option>
							<option value="advanced">Advanced</option>
						</select>
					</div>

					<div class="field full-width">
						<label>Interested Topics</label>
						<div class="chips">
							<label><input type="checkbox" name="topics" value="html" /> HTML</label>
							<label><input type="checkbox" name="topics" value="css" /> CSS</label>
							<label><input type="checkbox" name="topics" value="javascript" /> JavaScript</label>
							<label><input type="checkbox" name="topics" value="ui" /> UI Design</label>
						</div>
					</div>

					<div class="field full-width">
						<label for="notes">Short Bio / Notes</label>
						<textarea id="notes" name="notes" rows="4" placeholder="Write a short note about your background or goals"></textarea>
					</div>

					<div class="field full-width">
						<label for="photo">Profile Photo</label>
						<input type="file" id="photo" name="photo" accept="image/*" />
					</div>
				</div>

				<div class="form-actions">
					<button type="reset" class="btn btn-secondary">Clear</button>
					<button type="submit" class="btn btn-primary">Submit Entry</button>
				</div>
			</form>
		</section>
	</main>
</body>
</html>
